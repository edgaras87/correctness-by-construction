# Skill Template — the Master Copy is in correctness-by-construction.
# Copy into a CBC Run at the
# same path and fill; the filled file is the CBC Run's own (.claude/rules/delivered-copies.md, rule 8, A Skill Template is copied and filled).

# Flyway — the only DDL path, per the CBC Run's ground constraints.
# No credentials here: user/password are env-passed by compose
# (FLYWAY_USER=<project>_migrator). The url speaks the compose
# network's service name — this config is for the one-shot container.
flyway.url=jdbc:postgresql://postgres:5432/<project_db>
flyway.schemas=<project_schema>
flyway.locations=filesystem:/flyway/sql
